services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data   # named volume -> data tetap ada setelah down
    networks: [backend]
    healthcheck:                          # app baru start kalau DB benar-benar siap
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:                                  # BONUS: service cache
    image: redis:7.4.1-alpine
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]  # sehat kalau dibalas PONG
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Host = nama service (db, redis), BUKAN localhost / IP
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]

  adminer:                                # hanya jalan dengan --profile tools
    image: adminer:4.8.1
    profiles: [tools]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  pgdata: