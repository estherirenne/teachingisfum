<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeachingIsFum</title>
<style>
  :root { --bg:#fff7e0; --ink:#1d2b3a; --sea:#0f8fa8; --chum:#ff6b4a; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.55 "Trebuchet MS",Verdana,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--sea); color:#fff; padding:28px 20px; text-align:center; }
  header h1 { margin:0; font-size:2.2rem; letter-spacing:.5px; }
  header p { margin:6px 0 0; opacity:.9; }
  main { max-width:980px; margin:24px auto; padding:0 16px; display:grid; gap:20px; grid-template-columns:1fr 1fr; }
  @media (max-width:760px){ main{ grid-template-columns:1fr; } }
  section { background:var(--card); border:2px solid var(--ink); border-radius:12px; padding:18px; }
  section.wide { grid-column:1/-1; }
  h2 { margin-top:0; }
  label { display:block; font-weight:bold; margin-top:10px; }
  input, select, textarea { width:100%; padding:8px; border:2px solid var(--ink); border-radius:8px; font:inherit; }
  button { margin-top:12px; padding:9px 16px; border:2px solid var(--ink); border-radius:8px; background:var(--chum); color:#fff; font-weight:bold; cursor:pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--sea); outline-offset:2px; }
  li { margin:8px 0; }
  mark { background:#ffe14d; padding:2px 4px; border-radius:4px; }
  .tag { font-size:.8rem; padding:1px 8px; border-radius:10px; background:var(--sea); color:#fff; margin-right:6px; }
  .empty { color:#667; font-style:italic; }
  .del { margin:0 0 0 8px; padding:0 8px; background:#fff; color:var(--ink); }
  .tip { margin:4px 0; color:#556; font-size:.92rem; }
  blockquote { margin:6px 0 14px; padding:8px 12px; border-left:5px solid var(--chum); background:#fff3ee; border-radius:0 8px 8px 0; }
  ol { padding-left:22px; }
</style>
</head>
<body>
<header>
  <h1>TeachingIsFum</h1>
  <p>Teaching is fum, because learning to teach should be fun.</p>
</header>
<main>
  <section class="wide">
    <h2>Analisis materi</h2>
    <label for="age">Usia murid</label>
    <select id="age"><option>SD</option><option>SMP</option><option>SMA</option></select>
    <label for="text">Tempel teks materi ajar</label>
    <textarea id="text" rows="6" placeholder="Contoh: Variabel adalah tempat menyimpan data. Ingat, nama variabel harus jelas..."></textarea>
    <button id="btnAnalyze">Analisis materi</button>
    <div id="result"></div>
  </section>

  <section>
    <h2>Catatan baru</h2>
    <label for="kind">Jenis catatan</label>
    <select id="kind">
      <option value="self_gap">Kekurangan saya</option>
      <option value="student_strength">Kelebihan murid</option>
      <option value="student_improve">Murid perlu berkembang</option>
    </select>
    <label for="subject">Topik / nama murid</label>
    <input id="subject" maxlength="100">
    <label for="content">Isi catatan</label>
    <textarea id="content" rows="3" maxlength="1000"></textarea>
    <button id="btnSave">Simpan catatan</button>
    <p id="msg" role="status"></p>
  </section>

  <section>
    <h2>Daftar catatan</h2>
    <ul id="notes"></ul>
  </section>
</main>

<script>
const LABEL = { self_gap:"Kekurangan saya", student_strength:"Kelebihan murid", student_improve:"Perlu berkembang" };
const $ = id => document.getElementById(id);

async function loadNotes() {
  const notes = await (await fetch("/notes")).json();
  const ul = $("notes"); ul.innerHTML = "";
  if (!notes.length) { ul.innerHTML = '<li class="empty">Belum ada catatan. Tulis satu di formulir.</li>'; return; }
  notes.forEach(n => {
    const li = document.createElement("li");
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = LABEL[n.kind];
    const txt = document.createElement("span"); txt.textContent = n.subject + ": " + n.content;
    const del = document.createElement("button"); del.className = "del"; del.textContent = "Hapus";
    del.onclick = async () => { await fetch("/notes/" + n.id, { method:"DELETE" }); loadNotes(); };
    li.append(tag, txt, del); ul.append(li);
  });
}

$("btnSave").onclick = async () => {
  const res = await fetch("/notes", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ kind:$("kind").value, subject:$("subject").value, content:$("content").value }) });
  $("msg").textContent = res.status === 201 ? "Catatan tersimpan." : "Gagal menyimpan: isi topik dan catatan dulu.";
  if (res.status === 201) { $("subject").value = ""; $("content").value = ""; loadNotes(); }
};

$("btnAnalyze").onclick = async () => {
  const box = $("result"); box.textContent = "Menganalisis...";
  const res = await fetch("/analyze", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text:$("text").value, age_group:$("age").value }) });
  box.innerHTML = "";
  if (res.status !== 201) { box.textContent = "Teks minimal 20 karakter."; return; }
  const d = await res.json();
  const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
  const list = (items, fn) => { const ul = document.createElement("ul"); items.forEach(i => ul.append(fn(i))); return ul; };
  box.append(el("h3", "Yang terdeteksi dari materi"));
  box.append(el("p", "Bahasa: " + (d.detected.bahasa.join(", ") || "-") + " | Konsep: " + (d.detected.konsep.join(", ") || "-") + " | Project: " + d.detected.project));
  box.append(el("h3", "Perlu diperhatikan"));
  box.append(list(d.warnings, w => el("li", w)));
  if (d.highlights.length) {
    box.append(el("h3", "Kalimat kunci di materi"));
    box.append(list(d.highlights, s => { const li = document.createElement("li"); li.append(el("mark", s)); return li; }));
  }
  box.append(el("h3", "Urutan mengajar dan contoh kalimat (" + d.age_group + ")"));
  const ol = document.createElement("ol");
  d.steps.forEach(s => { const li = document.createElement("li"); li.append(el("strong", s.title)); li.append(el("p", "Saran: " + s.tip, "tip")); li.append(el("blockquote", s.script)); ol.append(li); });
  box.append(ol);
};
loadNotes();
</script>
</body>
</html>
